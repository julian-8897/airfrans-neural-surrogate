[project]
name = "airfoil-surrogate"
version = "0.1.0"
description = "Geometry-aware mesh-native surrogates for AirfRANS 2D RANS airfoil flow"
readme = "README.md"
authors = [
    { name = "julian-8897", email = "julianchan8897@gmail.com" }
]
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "huggingface-hub>=2.4.0",
    "numpy>=2.5.5",
    "pyarrow>=26.0.1",
    "pyyaml>=6.0.3",
    "torch>=2.15.0",
]

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "matplotlib>=3.11.2",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "NPY"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: long-running tests"]
